name: Build and release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release
        required: true
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            command: npm run dist:win -- --publish never
          - os: macos-latest
            platform: macos
            command: npm run dist:mac -- --publish never
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build installers
        run: ${{ matrix.command }}
      - name: Verify packaged application and licenses
        run: node scripts/verify-package.mjs
      - name: Verify macOS signatures and architectures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for entry in 'mac-arm64 arm64' 'mac x86_64'; do
            read -r directory architecture <<< "$entry"
            bundle="release/$directory/Transcribe.app"
            codesign --verify --deep --strict --verbose=2 "$bundle"
            lipo "$bundle/Contents/MacOS/Transcribe" -verify_arch "$architecture"
            expected=$(node -p "require('./package.json').version")
            actual=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$bundle/Contents/Info.plist")
            test "$actual" = "$expected"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packages-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: packages-*
          merge-multiple: true
          path: artifacts
      - name: Verify all downloads and generate SHA-256 checksums
        run: node scripts/verify-release.mjs artifacts
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-release.mjs
